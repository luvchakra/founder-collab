name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Import boundary lint
        run: npm run lint:boundaries

      - name: Migration schema lint
        run: npm run lint:migrations

      - name: Compliance (gst) no-duplicate-masters lint
        run: npm run lint:gst-no-duplicate-masters

      - name: Test
        run: npm run test

      - name: Discovery schema + RLS tenant-isolation test
        run: npm run test:db

      - name: Build
        run: npm run build
