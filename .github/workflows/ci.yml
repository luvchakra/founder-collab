name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Import boundary lint
        run: npm run lint:boundaries

      - name: Migration schema lint
        run: npm run lint:migrations

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
