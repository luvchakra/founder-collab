name: CI

# What runs where, and why: docs/testing/what-runs-where.md. In short --
#
#   pull request   fast checks only, as parallel jobs: typecheck, ESLint on the changed files,
#                  the unit tests related to the changed files (`vitest --changed`), the
#                  dependency audit -- plus the DB/RLS scripts for a migrated area and the
#                  build when app code changed. A dependency, config or CI change runs every
#                  unit test and the whole lint (scripts/ci-affected.mjs decides).
#   push to main   the same jobs with every unit test and the whole lint.
#   manual         Actions -> CI -> Run workflow: everything above, in full.
#
# No end-to-end tests here: they run nightly in e2e-nightly.yml.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Least privilege: jobs only read the repository (the alert job asks for issues: write itself).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # A new push to a PR makes its previous run worthless.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.base.outputs.base }}
      code: ${{ steps.affected.outputs.code }}
      unit: ${{ steps.affected.outputs.unit }}
      lint: ${{ steps.affected.outputs.lint }}
      build: ${{ steps.affected.outputs.build }}
      db: ${{ steps.affected.outputs.db }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: base
        # PR: its base commit. Push to main: the previous head. Manual: none -> full run.
        run: echo "base=${{ github.event.pull_request.base.sha || (github.event_name == 'push' && github.event.before) || '' }}" >> "$GITHUB_OUTPUT"
      - id: affected
        run: node scripts/ci-affected.mjs "${{ steps.base.outputs.base }}"
        env:
          CI_EVENT: ${{ github.event_name }}

  typecheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tsc build info from the latest run on any branch: it keys on file contents, so it
      # only skips work whose inputs are unchanged.
      - uses: actions/cache@v4
        with:
          path: .cache/tsc
          key: tsc-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: tsc-${{ hashFiles('package-lock.json') }}-
      - run: npm run typecheck

  lint:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The repo's own rules, whole-repo and quick (well under a second each).
      - name: Import boundary lint
        run: npm run lint:boundaries
      - name: Migration schema lint
        run: npm run lint:migrations
      - name: Migration grant lint
        run: npm run lint:migration-grants
      - name: Compliance (gst) no-duplicate-masters lint
        run: npm run lint:gst-no-duplicate-masters
      - uses: actions/cache@v4
        if: needs.changes.outputs.code == 'true'
        with:
          path: .cache/eslint
          key: eslint-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: eslint-${{ hashFiles('package-lock.json') }}-
      - name: ESLint (whole app)
        if: needs.changes.outputs.code == 'true' && needs.changes.outputs.lint == 'all'
        run: npm run lint
      - name: ESLint (changed files)
        if: needs.changes.outputs.code == 'true' && needs.changes.outputs.lint == 'changed'
        run: node scripts/lint-changed.mjs ${{ needs.changes.outputs.base }}

  unit:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Script tests (help content, progress tracker, linters, CI selection)
        run: npm run test:scripts
      - name: Unit tests (all)
        if: needs.changes.outputs.code == 'true' && needs.changes.outputs.unit == 'all'
        run: npm run test --workspaces --if-present
      - name: Unit tests (related to the changed files)
        if: needs.changes.outputs.code == 'true' && needs.changes.outputs.unit == 'changed'
        run: npm run test --workspaces --if-present -- --changed ${{ needs.changes.outputs.base }}

  audit:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # SEC-1: fail on a known high/critical advisory in anything that ships to production
      # (dev-only tooling never reaches a deployed bundle). This is what would have caught
      # next@16.3.4's critical RCE advisory (GHSA-vcvr-r3jv-pc5j) before it sat on main.
      # Reads the lockfile only: no install needed.
      - name: Dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high

  db:
    needs: changes
    if: needs.changes.outputs.db != ''
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Node built-ins and psql only: no npm install needed.
      - name: DB schema + RLS tenant-isolation tests
        run: node scripts/run-db-tests.mjs ${{ needs.changes.outputs.db != 'all' && needs.changes.outputs.db || '' }}

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build

  # The one check branch protection and the PR page look at: green only when every job
  # this change needed passed (a job skipped because the change didn't need it is fine).
  ci:
    needs: [changes, typecheck, lint, unit, audit, db, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Result
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          echo "$NEEDS" | jq -e '[to_entries[] | select(.value.result != "success" and .value.result != "skipped")] | length == 0' > /dev/null

  # A red main or a red manual run has nobody watching it: a failure opens one issue, or
  # comments on the one already open, with the run link.
  alert:
    name: Alert on failure
    if: always() && needs.ci.result == 'failure' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [changes, typecheck, lint, unit, audit, db, build, ci]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          title="CI failing on main"
          failed=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key) (\(.value.result))"] | join(", ")')
          body=$(printf '%s run on `%s` failed: %s\n\n%s' "$EVENT" "${GITHUB_SHA:0:7}" "$failed" "$RUN_URL")
          n=$(gh issue list --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
