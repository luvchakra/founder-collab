name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Import boundary lint
        run: npm run lint:boundaries

      - name: Migration schema lint
        run: npm run lint:migrations

      - name: Test
        run: npm run test

      # Runs the same suites again from the repo root to produce one cross-workspace
      # coverage number, and fails if any of vitest.config.mts's thresholds regress --
      # the per-path ones guard the directories that carry CLAUDE.md's non-negotiables.
      - name: Coverage thresholds
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      # The database half of the suite: applies the whole migration timeline to a
      # throwaway database and asserts tenancy, licensing and the ported StockPilot
      # compat views against real Postgres — RLS is authoritative (ADR-4/ADR-8), so it
      # is verified where it actually runs, not against a mock.
      - name: Schema, RLS and licensing database tests
        run: npm run test:db

      - name: Build
        run: npm run build
