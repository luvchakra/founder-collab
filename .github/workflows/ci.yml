name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Import boundary lint
        run: npm run lint:boundaries

      - name: Migration schema lint
        run: npm run lint:migrations

      - name: Migration grant lint
        run: npm run lint:migration-grants

      - name: Compliance (gst) no-duplicate-masters lint
        run: npm run lint:gst-no-duplicate-masters

      - name: Test
        run: npm run test

      - name: Discovery schema + RLS tenant-isolation test
        run: npm run test:db

      - name: Build
        run: npm run build

  # End-to-end + security suite (docs/testing/E2E_TEST_PLAN.md). Runs against the DEV
  # Supabase project only, with its own self-provisioned e2e-qa tenants
  # (apps/web/e2e/support/tenants.ts) that are torn down afterwards. Opt-in: it needs the
  # repository secrets below plus the repository variable E2E_ALLOW_FIXTURES=1, which is
  # the explicit "this project is safe to seed" switch -- without them the job reports
  # itself as skipped instead of failing. Never configure these with production keys.
  e2e:
    needs: ci
    runs-on: ubuntu-latest
    # Forks never receive secrets; don't start a job that cannot authenticate.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    # The fixtures use stable identities, so two runs at once would tear each other's
    # tenants down mid-test.
    concurrency:
      group: e2e-fixtures
      cancel-in-progress: false
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      CRON_SECRET: ${{ secrets.E2E_CRON_SECRET }}
      E2E_ALLOW_FIXTURES: ${{ vars.E2E_ALLOW_FIXTURES }}
      E2E_SELF_PROVISION: "1"
      E2E_TEST_BUSINESS_SLUG: acme-home-security-qa
      PLAYWRIGHT_BASE_URL: http://localhost:3100
      # GitHub runners are far from the dev project's region: allow for a server action's
      # round trips (a wait on UI state, not a sleep). See E2E_DEFECTS.md "Environment finding".
      E2E_EXPECT_TIMEOUT: "30000"
    steps:
      - name: Check E2E configuration
        id: config
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ "$E2E_ALLOW_FIXTURES" != "1" ]; then
            echo "::notice::E2E skipped: set the E2E_SUPABASE_* secrets and the E2E_ALLOW_FIXTURES=1 variable to enable it (dev project only)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.enabled == 'true'

      - uses: actions/setup-node@v4
        if: steps.config.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.config.outputs.enabled == 'true'
        run: npm install

      - name: Install Chromium
        if: steps.config.outputs.enabled == 'true'
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Build
        if: steps.config.outputs.enabled == 'true'
        run: npm run build

      - name: Start the app
        if: steps.config.outputs.enabled == 'true'
        working-directory: apps/web
        run: |
          nohup npx next start -p 3100 > next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3100/login && exit 0; sleep 1; done
          echo "app did not start"; tail -50 next.log; exit 1

      - name: Security + multi-user + critical-path E2E
        if: steps.config.outputs.enabled == 'true'
        working-directory: apps/web
        run: npx playwright test --project=security --project=multi-user --project=unauthenticated --project=desktop --project=mobile --timeout=90000

      - name: Upload failure evidence (traces, screenshots, videos)
        if: failure() && steps.config.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
