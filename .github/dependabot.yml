# Automated dependency updates (IT security: timely patching of known vulnerabilities).
# Security advisories open PRs immediately regardless of this schedule; the weekly run
# keeps routine version drift small enough to review.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
